<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor del Inversor</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap");
:root{
  --navy:#163D60;
  --navy2:#0f2c47;
  --ochre:#E29F34;
  --cream:#FDFBF7;
  --ink:#1a1a1a;
  --ok:#1d7a4f;
  --warn:#b3401f;
  --white:#fff;
  --line:rgba(22,61,96,.14);
  --muted:#657382;
  --soft:#f0f2f1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Montserrat,Arial,sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.5;
  overflow-x:hidden;
}
button,a{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh}
.hero{
  color:var(--white);
  background:linear-gradient(135deg,var(--navy2),var(--navy));
  padding:22px clamp(16px,5vw,72px) 36px;
}
.topbar,.hero-grid,.section{max-width:1240px;margin:0 auto}
.topbar{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:18px;
  margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-logo{height:70px;width:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
.official-badge{
  display:inline-flex;
  width:max-content;
  max-width:100%;
  border-radius:30px;
  padding:8px 18px;
  background:var(--ochre);
  color:var(--navy);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
  line-height:1.2;
  text-transform:uppercase;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
}
.private{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(253,251,247,.24);
  border-radius:999px;
  padding:8px 12px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:rgba(253,251,247,.92);
  background:rgba(255,255,255,.07);
  white-space:nowrap;
}
.private:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(29,122,79,.18)}
.hero-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(340px,.82fr);
  gap:34px;
  align-items:center;
  padding-top:4px;
}
.hero-copy{display:grid;gap:0;align-content:center;min-height:278px;min-width:0}
.identity-block{display:grid;gap:9px;align-items:start;margin-bottom:26px;min-width:0}
.operation-block{display:grid;gap:13px}
.eyebrow{
  display:inline-flex;
  width:max-content;
  max-width:100%;
  padding:7px 13px;
  border-radius:999px;
  color:#ffe0aa;
  background:rgba(226,159,52,.14);
  border:1px solid rgba(226,159,52,.35);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.3px;
  text-transform:uppercase;
}
h1{
  margin:0;
  max-width:760px;
  font-size:clamp(22px,6vw,40px);
  line-height:1.08;
  letter-spacing:0;
  color:var(--cream);
  font-weight:800;
}
.operation-title{
  margin:0;
  color:#ffe0aa;
  font-size:clamp(15px,1.35vw,17px);
  font-weight:600;
  font-style:italic;
  line-height:1.32;
}
.headline-line{
  margin:2px 0 0;
  color:#ffe0aa;
  font-size:clamp(16px,1.65vw,20px);
  font-weight:800;
}
.operation-location{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  width:max-content;
  max-width:100%;
  margin:0;
  padding:9px 12px;
  border:1px solid rgba(253,251,247,.18);
  border-radius:8px;
  color:rgba(253,251,247,.9);
  background:rgba(255,255,255,.07);
  font-size:clamp(14px,1.22vw,15px);
  font-weight:750;
}
.operation-location a{color:#ffe0aa;font-size:13px;font-weight:900;text-decoration:none}
.operation-location a:hover{text-decoration:underline}
.features{
  margin:0 0 14px;
  color:rgba(253,251,247,.85);
  font-size:clamp(14px,1.45vw,17px);
  font-weight:650;
}
.subhead{
  max-width:770px;
  margin:0;
  color:rgba(253,251,247,.76);
  font-size:15px;
}
.pulse-card{
  border:1px solid rgba(253,251,247,.16);
  background:rgba(253,251,247,.08);
  border-radius:8px;
  padding:20px;
  box-shadow:0 24px 58px rgba(0,0,0,.2);
}
.state-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.state{font-size:13px;font-weight:900;color:#ffe0aa;text-transform:uppercase;letter-spacing:.8px}
.chip,.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:max-content;
  max-width:100%;
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.3px;
  white-space:nowrap;
}
.chip.warn{background:rgba(226,159,52,.18);color:#ffe0aa;border:1px solid rgba(226,159,52,.34)}
.badge.ok{color:var(--ok);background:#eaf6ef;border:1px solid rgba(29,122,79,.2)}
.badge.warn{color:var(--warn);background:#f9eae5;border:1px solid rgba(179,64,31,.2)}
.badge.navy{background:rgba(22,61,96,.08);color:var(--navy);border:1px solid rgba(22,61,96,.12)}
.badge.gray{background:#e7e8e8;color:#60686e;border:1px solid rgba(96,104,110,.18)}
.phase-line{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 18px}
.phase{
  border:1px solid rgba(253,251,247,.14);
  border-radius:8px;
  padding:12px;
  background:rgba(255,255,255,.06);
}
.phase.done{background:rgba(29,122,79,.12)}
.phase.active{border-color:rgba(226,159,52,.58);background:rgba(226,159,52,.14)}
.phase small{display:flex;align-items:center;gap:7px;color:rgba(253,251,247,.82);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.phase b{display:block;margin-top:6px;color:var(--white);font-size:13px}
.check{
  display:inline-grid;
  place-items:center;
  width:17px;
  height:17px;
  border-radius:50%;
  background:var(--ok);
  color:#fff;
  font-size:11px;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 5px rgba(226,159,52,.17)}
.progress-line{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.bar span{display:block;width:var(--progress,0%);height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ochre),#f4c36d);animation:progressRun 2.8s ease-in-out infinite}
.pct{font-size:34px;line-height:1;font-weight:900;color:var(--white)}
.pulse-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{min-height:86px;border:1px solid rgba(253,251,247,.14);background:rgba(255,255,255,.06);border-radius:8px;padding:13px}
.mini span{display:block;color:#ffe0aa;font-size:10px;font-weight:900;letter-spacing:.9px;text-transform:uppercase}
.mini b{display:block;margin-top:7px;font-size:13px;color:var(--white)}
.page{padding:clamp(28px,5vw,62px) clamp(14px,5vw,72px)}
.section{margin-bottom:clamp(30px,5vw,56px)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}
.kicker{color:var(--ochre);font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}
h2{margin:4px 0 0;color:var(--navy);font-size:clamp(24px,3vw,34px);line-height:1.12;letter-spacing:0}
.note{margin:6px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 10px rgba(22,61,96,.05)}
.plan-card{padding:18px;overflow:hidden;background:linear-gradient(180deg,#fff,#fffdfa)}
.plan-wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:center}
.plan-frame{padding:14px;border:1px solid rgba(22,61,96,.13);border-radius:12px;background:#fbf6eb;box-shadow:0 16px 38px rgba(22,61,96,.08)}
.plan-img{display:block;width:100%;max-width:860px;height:auto;max-height:620px;object-fit:contain;margin:0 auto;border-radius:8px;background:var(--cream)}
.legend{display:grid;gap:10px}
.legend-item{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
.legend-item b{display:block;color:var(--navy);font-size:13px}
.legend-item span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.milestones{display:grid;grid-template-columns:repeat(10,minmax(158px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.milestone{position:relative;min-height:218px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.milestone.done{border-color:rgba(29,122,79,.36);background:linear-gradient(180deg,#f3fbf6,#fff);box-shadow:0 10px 26px rgba(29,122,79,.10)}
.milestone.current{border-color:rgba(226,159,52,.9);box-shadow:0 0 0 3px rgba(226,159,52,.18),0 16px 34px rgba(226,159,52,.18);background:#fff8ea}
.milestone.pending{border-color:rgba(22,61,96,.13);background:#fffdf8;opacity:.78}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--navy);font-weight:900;font-size:12px}
.done .num{background:var(--ok);color:var(--white);box-shadow:0 0 0 5px rgba(29,122,79,.12)}
.current .num{background:var(--ochre);color:var(--navy)}
.pending .num{background:#fff;border:1px solid rgba(22,61,96,.18);color:rgba(22,61,96,.55)}
.spark{width:9px;height:9px;border-radius:50%;background:var(--ochre);box-shadow:0 0 18px rgba(226,159,52,.65)}
.milestone b{display:block;margin:12px 0 8px;color:var(--navy);font-size:13px;line-height:1.24}
.date{color:var(--muted);font-size:11px;font-weight:800}
.meaning{margin:10px 0;color:#3f4d5a;font-size:12px;line-height:1.38}
.stamp{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;border-radius:999px;padding:5px 8px;background:#e7e8e8;color:#60686e;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.done .stamp{background:#e7f5ed;color:var(--ok);border:1px solid rgba(29,122,79,.22)}
.current .stamp{background:#fff2d9;color:#8a5a14}
.pending .stamp{background:#fff;border:1px solid rgba(22,61,96,.14);color:rgba(22,61,96,.55)}
.action-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:999px;
  padding:11px 15px;
  background:var(--navy);
  color:var(--white);
  font-size:12px;
  font-weight:900;
  text-decoration:none;
}
.btn.ochre{background:var(--ochre);color:var(--navy)}
.btn.whatsapp{padding:12px 18px;background:#25D366;color:#fff;box-shadow:0 14px 34px rgba(15,44,71,.16);text-align:left}
.btn.whatsapp span{display:block;color:#fff;font-size:13px;line-height:1.15}
.btn.whatsapp small{display:block;margin-top:2px;color:rgba(255,255,255,.82);font-size:10px;font-weight:700}
.btn svg{width:22px;height:22px;display:block}
.gantt-card{padding:18px;overflow-x:auto;overflow-y:hidden}
.gantt-inner{min-width:1060px;position:relative}
.gantt-grid{display:grid;grid-template-columns:64px 270px repeat(16,minmax(36px,1fr));gap:3px;position:relative}
.month-head,.week-head,.gantt-row{display:contents}
.month-head span,.month-head b{
  padding:0 0 8px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
  text-align:center;
  text-transform:uppercase;
}
.month-head b{grid-column:1 / 3}
.week-head span,.week-head b{
  padding:7px 0 8px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  font-size:10px;
  font-weight:900;
  text-align:center;
  text-transform:uppercase;
}
.week-head b{text-align:left}
.week-current{
  position:absolute;
  top:0;
  bottom:0;
  left:calc(334px + ((100% - 334px) / 16) * 2.5);
  width:2px;
  background:rgba(226,159,52,.58);
  z-index:3;
}
.week-current span{
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  border-radius:999px;
  padding:4px 8px;
  background:var(--navy);
  color:#fff;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}
.gantt-cap,.gantt-task{
  min-height:31px;
  padding:8px 8px 7px 0;
  color:var(--navy);
  border-bottom:1px solid rgba(22,61,96,.08);
  font-size:12px;
  font-weight:900;
}
.gantt-task{font-weight:800}
.gcell{height:31px;border-bottom:1px solid rgba(22,61,96,.08);position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(22,61,96,.035),rgba(22,61,96,.02))}
.bar-seg{
  height:16px;
  margin-top:7px;
  border-radius:4px;
  background:var(--bar);
  box-shadow:inset 0 0 0 1px rgba(15,44,71,.07);
}
.bar-seg.bg{height:12px;margin-top:9px;border-radius:999px;opacity:.72}
.gantt-milestone-label{
  display:flex;
  align-items:center;
  justify-content:center;
  width:calc(100% - 8px);
  max-width:70px;
  height:18px;
  margin:6px auto 0;
  border-radius:5px;
  color:var(--navy);
  background:rgba(226,159,52,.2);
  border:1px solid rgba(226,159,52,.42);
  font-size:10px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}
.gantt-note{display:flex;align-items:center;gap:9px;margin:10px 0 12px;padding:10px 12px;border:1px solid rgba(22,61,96,.13);border-radius:8px;background:#f7f3ea;color:var(--navy);font-size:12px;font-weight:800}
.gantt-note:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 4px rgba(226,159,52,.15)}
.gantt-foot{margin:13px 0 0;color:var(--muted);font-size:12px;font-weight:800}
.bank-card{padding:18px;margin-bottom:14px}
.bank-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.santander{display:flex;align-items:center;gap:10px;color:#EC0000;font-size:26px;font-weight:900;letter-spacing:0}
.santander svg{width:30px;height:30px;display:block;fill:#EC0000;flex:0 0 auto}
.iban{color:var(--navy);font-size:13px;font-weight:800}
.iban small{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:700}
.exclusive-account{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(226,159,52,.35);border-radius:8px;background:#fff8eb;color:var(--navy);font-size:12px;font-weight:900}
.finance-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tranche-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 10px}
.tranche{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tranche.done{border-color:rgba(29,122,79,.22);background:#f7fcf9}
.tranche.pending{border-color:rgba(226,159,52,.3);background:#fff9ed}
.tranche-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tranche span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
.tranche b{display:block;color:var(--navy);font-size:14px}
.tranche strong{display:block;margin-top:10px;color:var(--navy);font-size:22px;line-height:1}
.finance-note{margin:10px 0 0;color:var(--muted);font-size:11px;font-weight:700}
.metric{padding:15px;background:#fff;border:1px solid var(--line);border-radius:8px}
.metric span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.metric b{display:block;margin-top:8px;color:var(--navy);font-size:clamp(20px,2.3vw,28px);line-height:1}
.metric small{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.table-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 0}
.filters{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#eef1f2}
.filter{border:0;border-radius:999px;padding:8px 11px;background:transparent;color:var(--navy);font-size:12px;font-weight:800}
.filter.active{background:var(--white);box-shadow:0 1px 5px rgba(22,61,96,.12)}
.table-wrap{overflow-x:auto;padding:14px}
table{width:100%;min-width:820px;border-collapse:collapse}
th,td{padding:13px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{color:var(--navy);font-size:11px;letter-spacing:.9px;text-transform:uppercase}
td.amount{font-weight:900;white-space:nowrap}
td.amount.out{color:var(--warn)}
td.amount.in{color:var(--ok)}
td.doc a{color:var(--navy);font-weight:800;text-decoration:none}
.panel{padding:20px}
.camera-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
.camera-frame{
  position:relative;
  aspect-ratio:16/9;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px dashed rgba(22,61,96,.3);
  border-radius:8px;
  background:linear-gradient(135deg,rgba(22,61,96,.08),rgba(226,159,52,.12)),#f6f4ef;
}
.camera-frame:before{content:"";position:absolute;inset:12px;border:1px solid rgba(22,61,96,.08);border-radius:6px}
.camera-frame.has-stream{display:block;border:0;background:#000}
.camera-frame.has-stream:before{display:none}
.camera-frame iframe{display:block;width:100%;height:100%;border:0}
.camera-copy{position:relative;text-align:center;padding:18px;color:var(--navy)}
.camera-copy strong{display:block;font-size:17px}
.camera-copy span{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.folder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.folder{
  min-height:88px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--navy);
  background:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
}
.folder:hover{border-color:rgba(226,159,52,.75);box-shadow:0 8px 22px rgba(22,61,96,.08)}
.folder svg{flex:0 0 28px;width:28px;height:28px;fill:var(--ochre)}
.feed{display:grid;gap:12px}
.entry{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:16px}
.entry-date{color:var(--ochre);font-size:11px;font-weight:900;text-transform:uppercase}
.entry.market .entry-date{color:var(--navy)}
.entry b{display:block;color:var(--navy);font-size:15px}
.entry p{margin:4px 0 0;color:var(--muted);font-size:13px}
.entry-source{display:inline-block;margin-top:8px;color:var(--navy);font-size:12px;font-weight:900;text-decoration:none}
.entry-source:hover{color:var(--ochre)}
.report{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px;color:var(--white);background:linear-gradient(135deg,var(--navy2),var(--navy))}
.report span{display:block;color:#ffe0aa;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.report b{display:block;margin-top:4px;font-size:clamp(20px,3vw,30px)}
.report p{margin:8px 0 0;color:rgba(253,251,247,.78);font-size:14px}
.data-warning{position:fixed;right:18px;bottom:18px;z-index:20;max-width:330px;padding:14px 16px;border:1px solid rgba(226,159,52,.45);border-radius:8px;background:var(--white);color:var(--navy);box-shadow:0 18px 45px rgba(15,44,71,.22);font-size:13px;font-weight:800}
.data-warning[hidden]{display:none}
.access-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px 18px;
  color:var(--cream);
  background:var(--navy);
}
.access-panel{
  width:min(100%,420px);
  display:grid;
  gap:18px;
  justify-items:center;
  text-align:center;
}
.access-logo{
  width:min(178px,52vw);
  height:auto;
  display:block;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.2));
}
.access-title{
  margin:8px 0 0;
  color:var(--cream);
  font-size:clamp(23px,7vw,34px);
  line-height:1.12;
  font-weight:800;
}
.access-context{
  margin:0;
  max-width:36ch;
  color:rgba(253,251,247,.78);
  font-size:14px;
  font-weight:600;
}
.access-form{
  width:100%;
  display:grid;
  gap:12px;
  margin-top:8px;
}
.access-field{
  display:grid;
  gap:7px;
  text-align:left;
}
.access-field label{
  color:#ffe0aa;
  font-size:12px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.access-field input{
  width:100%;
  min-height:48px;
  border:1px solid rgba(253,251,247,.25);
  border-radius:8px;
  padding:12px 13px;
  background:rgba(255,255,255,.08);
  color:var(--cream);
  font-size:16px;
  outline:none;
}
.access-field input:focus{
  border-color:var(--ochre);
  box-shadow:0 0 0 3px rgba(226,159,52,.24);
}
.access-field input::placeholder{color:rgba(253,251,247,.45)}
.access-submit{
  min-height:48px;
  border:0;
  border-radius:999px;
  padding:12px 18px;
  background:var(--ochre);
  color:var(--navy);
  font-size:13px;
  font-weight:900;
}
.access-submit:disabled{
  cursor:wait;
  opacity:.68;
}
.access-error{
  min-height:20px;
  margin:0;
  color:#ffe0aa;
  font-size:13px;
  font-weight:800;
}
@keyframes progressRun{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18);box-shadow:0 0 18px rgba(226,159,52,.38)}}
@media(max-width:1040px){
  .hero-grid,.plan-wrap{grid-template-columns:1fr}
  .finance-summary{grid-template-columns:1fr}
  .tranche-grid{grid-template-columns:1fr}
  .folder-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .topbar{align-items:flex-start}
  .brand{gap:10px}
  .brand-logo{height:56px}
  .official-badge{font-size:9px;letter-spacing:1.1px;padding:7px 12px}
  .private{padding:7px 9px;font-size:10px}
  .hero-copy{min-height:0}
  .operation-location{width:100%;font-size:13px}
  .phase-line,.pulse-meta,.camera-grid,.folder-grid{grid-template-columns:1fr}
  .section-head{display:block}
  .milestones{grid-template-columns:repeat(10,162px);margin-inline:-14px;padding-inline:14px}
  .gantt-note{flex-wrap:wrap;align-items:flex-start}
  .gantt-note:before{flex-shrink:0;margin-top:2px}
  .bank-top{display:block}
  .iban{margin-top:10px}
  .table-tools{align-items:flex-start}
  .entry{grid-template-columns:1fr}
  .report{display:block}
  .report .btn{margin-top:16px}
}
</style>
</head>
<body>
<section class="access-screen" id="accessScreen" aria-labelledby="accessTitle">
  <div class="access-panel">
    <img class="access-logo" src="logo-cdu-blanco.png" alt="CdU">
    <h1 class="access-title" id="accessTitle">Visor del Inversor</h1>
    <p class="access-context">Acceso privado a los datos de la operación Torres de Cotillas.</p>
    <form class="access-form" id="accessForm" autocomplete="off">
      <div class="access-field">
        <label for="accessPassword">Contraseña</label>
        <input id="accessPassword" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="access-submit" id="accessSubmit" type="submit">Entrar</button>
      <p class="access-error" id="accessError" role="alert" aria-live="assertive"></p>
    </form>
  </div>
</section>
<template id="visorTemplate">
<div class="shell">
  <header class="hero">
    <div class="topbar">
      <div class="private">Acceso privado</div>
    </div>
    <div class="hero-grid">
      <div class="hero-copy">
        <div class="identity-block">
          <div class="brand">
            <img class="brand-logo" src="logo-cdu-blanco.png" alt="CdU">
          </div>
          <div class="official-badge">Visor del Inversor · Herramienta oficial</div>
          <p class="operation-title">El cuadro de mandos de tu inversión</p>
        </div>
        <div class="operation-block">
          <h1 id="operationName">Operación: pendiente de confirmar</h1>
          <p class="headline-line" id="operationSummary">pendiente de confirmar</p>
          <p class="operation-location" id="operationLocation">pendiente de confirmar</p>
          <p class="features" id="operationRefs">pendiente de confirmar</p>
          <p class="subhead">Primero claridad. Luego control. Y al final, resultado. Una operación medida, documentada y visible de principio a fin.</p>
        </div>
      </div>
      <section class="pulse-card" aria-label="Estado y avance">
        <div class="state-line">
          <div class="state">Estado de operación</div>
          <span class="chip warn" id="operationState">pendiente de confirmar</span>
        </div>
        <div class="phase-line" id="phaseLine"></div>
        <div class="progress-line">
          <div class="bar" id="progressBar" aria-label="0% de avance global de operación"><span></span></div>
          <div class="pct" id="progressPct">0%</div>
        </div>
        <div class="pulse-meta" id="pulseMeta"></div>
      </section>
    </div>
  </header>

  <main class="page">
    <section class="section" id="transformacion">
      <div class="section-head">
        <div>
          <div class="kicker">Transformación</div>
          <h2 id="planTitle">Encaje de la operación</h2>
          <p class="note" id="planNote">pendiente de confirmar</p>
        </div>
        <span class="badge navy">Plano real del encaje</span>
      </div>
      <div class="card plan-card">
        <div class="plan-wrap">
          <div class="plan-frame">
            <img class="plan-img" src="encaje-plano.png" alt="Plano real de distribución">
          </div>
          <div class="legend" id="planLegend"></div>
        </div>
      </div>
    </section>

    <section class="section" id="hitos">
      <div class="section-head">
        <div>
          <div class="kicker">Hitos de operación</div>
          <h2 id="milestoneTitle">pendiente de confirmar</h2>
          <p class="note">Los hitos cubren toda la operación. Lo conseguido brilla, el hito actual marca dónde estamos y lo pendiente queda preparado para lo que viene.</p>
        </div>
        <span class="badge navy" id="milestoneCounter">pendiente de confirmar</span>
      </div>
      <div class="milestones" id="milestones"></div>
      <div class="action-row">
        <p class="note">Celebración sobria: sello, evidencia y actualización del punto de avance.</p>
      </div>
    </section>

    <section class="section" id="cronograma">
      <div class="section-head">
        <div>
          <div class="kicker">Cronograma</div>
          <h2 id="ganttTitle">pendiente de confirmar</h2>
          <p class="note" id="ganttNoteIntro">pendiente de confirmar</p>
        </div>
      </div>
      <div class="card gantt-card">
        <div class="gantt-note" id="ganttNote">pendiente de confirmar</div>
        <div class="gantt-inner">
          <div class="week-current" id="weekCurrent" aria-hidden="true"><span id="ganttCurrentWeek">pendiente de confirmar</span></div>
          <div class="gantt-grid" id="gantt"></div>
        </div>
        <p class="gantt-foot" id="ganttFoot">pendiente de confirmar</p>
      </div>
    </section>

    <section class="section" id="cuentas">
      <div class="section-head">
        <div>
          <div class="kicker">Económico</div>
          <h2>Extracto de la cuenta de la operación</h2>
          <p class="note">Cuenta bancaria dedicada para que las aportaciones y pagos de la operación queden separados del resto de operaciones.</p>
        </div>
      </div>
      <div class="card bank-card">
        <div class="bank-top">
          <div class="santander">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M31.7 5.2c7.2 9.4 2.9 15.7-2.2 21.1-4.2 4.5-8.9 9.4-4.4 16.7-8.2-4.2-10.8-12.4-6.5-20.2 2.4-4.4 8.1-8.8 13.1-17.6Z"/>
              <path d="M40.9 13.5c9.1 7.1 13.8 15.1 13.8 23.2 0 11.1-10.2 19.6-22.7 19.6S9.3 47.8 9.3 36.7c0-6.1 3.2-12 9-17.2-1.6 3.9-1.6 7.8.1 11.5 2.5 5.6 8.1 9.5 14.8 10.3-5.2-7.6-.8-13.2 3.4-18.4 2.2-2.8 4.4-5.5 4.3-9.4Z"/>
            </svg>
            <span>Santander</span>
          </div>
          <div class="iban" id="iban">pendiente de confirmar</div>
        </div>
        <div class="exclusive-account" id="exclusiveAccount">Cuenta dedicada de la operación</div>
        <div class="tranche-grid" id="trancheGrid"></div>
        <div class="finance-summary" id="financeSummary"></div>
        <p class="finance-note" id="financeNote">Los importes pendientes se mostrarán cuando estén confirmados.</p>
      </div>
      <div class="card">
        <div class="table-tools">
          <strong>Movimientos bancarios</strong>
          <div class="filters" aria-label="Filtro de movimientos">
            <button class="filter active" data-filter="Todos" type="button">Todos</button>
            <button class="filter" data-filter="ingreso" type="button">Ingresos</button>
            <button class="filter" data-filter="pago" type="button">Pagos</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Importe</th><th>Estado</th><th>Doc</th></tr>
            </thead>
            <tbody id="movements"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="section" id="obra">
      <div class="card panel">
        <div class="section-head">
          <div>
            <div class="kicker">En directo</div>
            <h2>Sigue la obra en tiempo real</h2>
            <p class="note" id="obraNote">Dos puntos de seguimiento preparados para activar la señal durante la ejecución.</p>
          </div>
          <span class="badge warn" id="obraBadge">pendiente de confirmar</span>
        </div>
        <div class="camera-grid" id="cameraGrid"></div>
      </div>
    </section>

    <section class="section" id="documentacion">
      <div class="section-head">
        <div>
          <div class="kicker">Documentación</div>
          <h2>Documentación de la operación</h2>
          <p class="note">Carpetas de consulta de la operación. Acceso con tu email autorizado.</p>
        </div>
      </div>
      <div class="folder-grid" id="folders"></div>
    </section>

    <section class="section" id="bitacoraSection" hidden>
      <div class="section-head">
        <div>
          <div class="kicker">Bitácora</div>
          <h2>Últimas actualizaciones</h2>
          <p class="note">Novedades propias de esta operación, registradas por el gestor.</p>
        </div>
      </div>
      <div class="feed" id="bitacoraFeed"></div>
    </section>

    <section class="section" id="noticiasMercadoSection" hidden>
      <div class="section-head">
        <div>
          <div class="kicker">Noticias del mercado</div>
          <h2>Contexto externo</h2>
          <p class="note">Precios de la zona, cambios normativos y noticias del sector.</p>
        </div>
      </div>
      <div class="feed" id="noticiasMercadoFeed"></div>
    </section>

    <section class="section">
      <div class="card report">
        <div>
          <span>Contacto directo</span>
          <b>Equipo CdU de 0 a Éxito</b>
          <p>Transparencia, seguimiento y decisiones con datos de la operación.</p>
        </div>
        <a class="btn whatsapp" id="whatsappLink" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 3.2A12.7 12.7 0 0 0 5.1 22.5L3.5 28.8l6.4-1.7A12.7 12.7 0 1 0 16 3.2Zm0 2.4a10.3 10.3 0 0 1 8.7 15.8 10.3 10.3 0 0 1-13.9 3.4l-.5-.3-3.2.8.9-3.1-.3-.5A10.3 10.3 0 0 1 16 5.6Zm5.9 13.5c-.3-.2-2-1-2.3-1.1-.3-.1-.6-.2-.8.2-.2.3-.9 1.1-1.1 1.4-.2.2-.4.2-.8.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.2-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2.1-.4 0-.6-.1-.2-.8-1.9-1.1-2.6-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.3 3.3 1.5 3.6c.2.2 2.5 3.8 6.1 5.3.9.4 1.5.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.2-.2-.5-.3-.9-.5Z"/></svg>
          <span>Contactar por WhatsApp<small>Equipo CdU de 0 a Éxito</small></span>
        </a>
      </div>
    </section>
  </main>
</div>
</template>
<div class="data-warning" id="dataWarning" role="status" hidden>No se han podido cargar los datos de la operación. Revisa la conexión o el origen configurado.</div>

<script>
const ORIGEN_DATOS = 'https://xaviriera.github.io/operaciones-gestor/data/tdc/operacion.json';
const ORIGEN_LLAVERO = 'https://xaviriera.github.io/operaciones-gestor/data/tdc/llavero.json';

let datosOperacion=null;
let filtroActivo="Todos";
let claveMaestra=null;
let llaveroCifrado=null;
let visorMontado=false;
const MODO_CLARO=new URLSearchParams(window.location.search).get("claro")==="1";
const PENDIENTE="pendiente de confirmar";
const CAMARA_SIN_SENAL="disponible al iniciar la obra";
const ESTADOS={conseguido:"done",actual:"current",pendiente:"pending"};

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}
function escapeAttr(value){
  return escapeHtml(value).replace(/`/g,"&#96;");
}
function valor(value){
  return value===null || value===undefined || value==="" ? PENDIENTE : value;
}
function folderIcon(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5v-10Z"/></svg>';
}
function estadoClase(estado){
  return ESTADOS[estado] || "pending";
}
function estadoEtiqueta(estado){
  if(estado==="conseguido") return "Conseguido";
  if(estado==="actual") return "En proceso";
  return "Pendiente";
}
function renderOperacion(){
  const operacion=datosOperacion.operacion || {};
  document.title=`Visor del Inversor · ${valor(operacion.nombre)}`;
  document.getElementById("operationName").textContent=`Operación: ${valor(operacion.nombre)}`;
  document.getElementById("operationSummary").textContent=valor(operacion.resumen_una_linea);
  document.getElementById("operationLocation").textContent=valor(operacion.direccion);
  document.getElementById("operationRefs").textContent=[
    `Referencia catastral: ${valor(operacion.referencia_catastral)}`,
    `Finca registral: ${valor(operacion.finca_registral)}`
  ].join(" · ");
  document.getElementById("planNote").textContent=valor(operacion.resumen_una_linea);
  document.getElementById("planLegend").innerHTML=[
    ["Dirección", operacion.direccion],
    ["Referencia catastral", operacion.referencia_catastral],
    ["Finca registral", operacion.finca_registral]
  ].map(([label,value])=>`<div class="legend-item"><b>${escapeHtml(label)}</b><span>${escapeHtml(valor(value))}</span></div>`).join("");
}
function renderEstado(){
  const estado=datosOperacion.estado || {};
  document.getElementById("operationState").textContent=valor(estado.fase_actual);
  document.getElementById("phaseLine").innerHTML=(estado.fases || []).map(fase=>{
    const clase=estadoClase(fase.estado);
    const icono=clase==="done" ? '<span class="check">✓</span>' : '<span class="dot"></span>';
    return `<div class="phase ${escapeAttr(clase)}"><small>${icono} ${escapeHtml(estadoEtiqueta(fase.estado))}</small><b>${escapeHtml(valor(fase.nombre))}</b></div>`;
  }).join("");
  const avance=Number(estado.porcentaje_avance) || 0;
  const progressBar=document.getElementById("progressBar");
  progressBar.setAttribute("aria-label",`${avance}% de avance global de operación`);
  progressBar.querySelector("span").style.setProperty("--progress",`${avance}%`);
  document.getElementById("progressPct").textContent=`${avance}%`;
  document.getElementById("pulseMeta").innerHTML=`
    <div class="mini"><span>Fase actual</span><b>${escapeHtml(valor(estado.fase_actual))}</b></div>
    <div class="mini"><span>Avance</span><b>${avance}%</b></div>`;
}
function renderHitos(){
  const items=datosOperacion.hitos || [];
  const conseguidos=items.filter(item=>item.estado==="conseguido").length;
  const total=items.length;
  document.getElementById("milestoneCounter").textContent=total ? `${conseguidos} de ${total} hitos` : PENDIENTE;
  document.getElementById("milestoneTitle").textContent=total ? `${conseguidos} de ${total} hitos conseguidos` : PENDIENTE;
  document.getElementById("milestones").innerHTML=items.map((hito,i)=>{
    const clase=estadoClase(hito.estado);
    return `
    <article class="milestone ${escapeAttr(clase)}" data-index="${i}">
      <div>
        <div class="toprow"><span class="num">${clase==="done" ? "✓" : i+1}</span>${clase==="current" ? '<span class="spark" aria-hidden="true"></span>' : ""}</div>
        <b>${escapeHtml(valor(hito.nombre))}</b><span class="date">${escapeHtml(valor(hito.fecha))}</span><p class="meaning">${escapeHtml(valor(hito.detalle))}</p>
      </div>
      <div><span class="stamp">${clase==="done" ? "✓ Conseguido" : estadoEtiqueta(hito.estado)}</span></div>
    </article>`;
  }).join("");
}
function renderGantt(){
  const cronograma=datosOperacion.cronograma || {};
  const capitulos=cronograma.capitulos || [];
  const total=Math.max(Number(cronograma.total_semanas) || 16, 1);
  const semanaActual=Number(cronograma.semana_actual) || 0;
  document.getElementById("ganttTitle").textContent=`Cronograma de obra · ${total} semanas`;
  document.getElementById("ganttNoteIntro").textContent=`Semana actual: ${semanaActual || PENDIENTE}`;
  document.getElementById("ganttNote").textContent=(cronograma.notas_transversales || []).join(" · ") || PENDIENTE;
  document.getElementById("ganttCurrentWeek").textContent=semanaActual ? `Semana ${semanaActual}` : PENDIENTE;
  document.getElementById("ganttFoot").textContent=`Cronograma de obra · ${total} semanas`;
  document.getElementById("gantt").style.gridTemplateColumns=`64px 270px repeat(${total},minmax(36px,1fr))`;
  document.getElementById("weekCurrent").style.left=`calc(334px + ((100% - 334px) / ${total}) * ${Math.max(semanaActual - .5, 0)})`;
  const head=`<div class="week-head"><b>Cap</b><b>Tarea</b>${Array.from({length:total},(_,i)=>`<span>S${i+1}</span>`).join("")}</div>`;
  const rows=capitulos.map((fila,index)=>`
    <div class="gantt-row">
      <div class="gantt-cap">${index+1}</div>
      <div class="gantt-task">${escapeHtml(valor(fila.nombre))}</div>
      ${Array.from({length:total},(_,i)=>{
        const week=i+1;
        const inicio=Number(fila.semana_inicio) || 0;
        const fin=Number(fila.semana_fin) || 0;
        const inRange=week>=inicio&&week<=fin;
        const tipo=fila.color_o_tipo || "#163D60";
        const marker=tipo==="hito" ? `<div class="gantt-milestone-label">✓ Hito</div>` : `<div class="bar-seg" style="--bar:${escapeAttr(tipo)}"></div>`;
        return `<div class="gcell">${inRange?marker:""}</div>`;
      }).join("")}
    </div>
  `).join("");
  document.getElementById("gantt").innerHTML=head+rows;
}
function renderMovements(filter="Todos"){
  const movimientos=(datosOperacion.cuentas || {}).movimientos || [];
  document.getElementById("movements").innerHTML=movimientos
    .filter(item=>filter==="Todos"||item.tipo===filter)
    .map(item=>{
      const income=item.tipo==="ingreso";
      return `
      <tr>
        <td>${escapeHtml(valor(item.fecha))}</td><td>${escapeHtml(valor(item.concepto))}</td><td>${escapeHtml(valor(item.tipo))}</td><td class="amount ${income?"in":"out"}">${escapeHtml(valor(item.importe))}</td>
        <td><span class="badge ${income?"ok":"warn"}">${escapeHtml(income?"Ingreso":"Pago")}</span></td>
        <td class="doc"><a href="#documentacion">Ver documentación</a></td>
      </tr>`;
    }).join("");
}
function renderEconomico(){
  const cuentas=datosOperacion.cuentas || {};
  document.getElementById("iban").innerHTML=`${escapeHtml(valor(cuentas.iban))} <small>Cuenta dedicada de la operación</small>`;
  document.getElementById("trancheGrid").innerHTML=(cuentas.tramos || []).map(item=>{
    const ok=Boolean(item.confirmado);
    return `
    <div class="tranche ${ok?"done":"pending"}"><div class="tranche-top"><span>${escapeHtml(valor(item.nombre))}</span><span class="badge ${ok?"ok":"warn"}">${ok?"Confirmado":"Pendiente"}</span></div><b>${escapeHtml(valor(item.fecha))}</b><strong>${escapeHtml(valor(item.importe))}</strong></div>`;
  }).join("");
  document.getElementById("financeSummary").innerHTML=[
    ["IBAN", cuentas.iban, "Dato bancario pendiente de terceros"],
    ["Tramos", (cuentas.tramos || []).length || null, "Número de tramos configurados"],
    ["Movimientos", (cuentas.movimientos || []).length || null, "Movimientos visibles en el extracto"],
    ["Pendientes", (cuentas.tramos || []).filter(item=>!item.confirmado).length || null, "Importes por confirmar"]
  ].map(([label,value,detail])=>`
    <div class="metric"><span>${escapeHtml(label)}</span><b>${escapeHtml(valor(value))}</b><small>${escapeHtml(detail)}</small></div>
  `).join("");
  renderMovements(filtroActivo);
}
function renderCamaras(){
  const camaras=datosOperacion.camaras || [];
  document.getElementById("obraBadge").textContent=camaras.some(camara=>camara.url) ? "Señal activa" : CAMARA_SIN_SENAL;
  document.getElementById("cameraGrid").innerHTML=camaras.map(camara=>{
    if(camara.url){
      return `<div class="camera-frame has-stream"><iframe src="${escapeAttr(camara.url)}" title="${escapeAttr(valor(camara.nombre))}" allowfullscreen loading="lazy"></iframe></div>`;
    }
    return `
      <div class="camera-frame">
        <div class="camera-copy"><strong>${escapeHtml(valor(camara.nombre))}</strong><span>${CAMARA_SIN_SENAL}</span></div>
      </div>`;
  }).join("");
}
function renderFolders(){
  const docs=(datosOperacion.documentacion || []).filter(item=>item.visible!==false);
  document.getElementById("folders").innerHTML=docs.map(item=>`
    <a class="folder card" href="${escapeAttr(item.url_drive || "#")}" target="_blank" rel="noopener">${folderIcon()}<span>${escapeHtml(valor(item.nombre))}</span></a>
  `).join("");
}
function renderBitacora(){
  const section=document.getElementById("bitacoraSection");
  const feed=document.getElementById("bitacoraFeed");
  const items=Array.isArray(datosOperacion.bitacora) ? datosOperacion.bitacora : [];
  section.hidden=items.length===0;
  if(section.hidden){
    feed.innerHTML="";
    return;
  }
  feed.innerHTML=items.map(item=>`
    <article class="card entry"><div class="entry-date">${escapeHtml(valor(item.fecha))}</div><div><b>${escapeHtml(valor(item.titulo))}</b><p>${escapeHtml(valor(item.texto))}</p></div></article>
  `).join("");
}
function renderNoticiasMercado(){
  const section=document.getElementById("noticiasMercadoSection");
  const feed=document.getElementById("noticiasMercadoFeed");
  const items=Array.isArray(datosOperacion.noticias_mercado) ? datosOperacion.noticias_mercado : [];
  section.hidden=items.length===0;
  if(section.hidden){
    feed.innerHTML="";
    return;
  }
  feed.innerHTML=items.map(item=>{
    const enlace=item.enlace ? `<a class="entry-source" href="${escapeAttr(item.enlace)}" target="_blank" rel="noopener">Fuente</a>` : "";
    return `<article class="card entry market"><div class="entry-date">${escapeHtml(valor(item.fecha))}</div><div><b>${escapeHtml(valor(item.titular))}</b><p>${escapeHtml(valor(item.texto))}</p>${enlace}</div></article>`;
  }).join("");
}
function renderContacto(){
  const contacto=datosOperacion.contacto || {};
  const enlace=document.getElementById("whatsappLink");
  if(contacto.whatsapp_numero){
    enlace.href=`https://wa.me/${encodeURIComponent(contacto.whatsapp_numero)}?text=${encodeURIComponent(contacto.mensaje_predeterminado || "")}`;
  }else{
    enlace.removeAttribute("href");
  }
}
function renderTodo(){
  renderOperacion();
  renderEstado();
  renderHitos();
  renderGantt();
  renderEconomico();
  renderCamaras();
  renderFolders();
  renderBitacora();
  renderNoticiasMercado();
  renderContacto();
}
function showDataWarning(){
  document.getElementById("dataWarning").hidden=false;
}
function montarVisor(){
  if(visorMontado) return;
  const template=document.getElementById("visorTemplate");
  document.getElementById("accessScreen")?.remove();
  document.body.insertBefore(template.content.cloneNode(true), document.getElementById("dataWarning"));
  visorMontado=true;
  document.querySelectorAll(".filter").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      filtroActivo=btn.dataset.filter;
      if(datosOperacion) renderMovements(filtroActivo);
    });
  });
}
function base64ToBytes(value){
  const binary=atob(value);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i+=1) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function bytesToText(bytes){
  return new TextDecoder().decode(bytes);
}
async function derivarClavePassword(password,salt,iteraciones){
  const material=await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:iteraciones,hash:"SHA-256"},
    material,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
}
async function abrirSobre(password,sobre,iteraciones){
  const clavePassword=await derivarClavePassword(password,base64ToBytes(sobre.salt),iteraciones);
  const clavePlano=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:base64ToBytes(sobre.iv)},
    clavePassword,
    base64ToBytes(sobre.clave_cifrada)
  );
  return crypto.subtle.importKey("raw",clavePlano,{name:"AES-GCM"},false,["decrypt"]);
}
async function obtenerClaveMaestra(password,llavero){
  for(const sobre of llavero.sobres || []){
    try{
      return await abrirSobre(password,sobre,llavero.iteraciones);
    }catch(error){
      continue;
    }
  }
  throw new Error("Contraseña incorrecta");
}
async function cargarLlavero(){
  if(llaveroCifrado) return llaveroCifrado;
  const response=await fetch(ORIGEN_LLAVERO);
  if(!response.ok) throw new Error("No se ha podido cargar el llavero");
  llaveroCifrado=await response.json();
  return llaveroCifrado;
}
async function descifrarContenido(llavero,masterKey){
  const contenido=llavero.contenido || {};
  const plano=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:base64ToBytes(contenido.iv)},
    masterKey,
    base64ToBytes(contenido.datos)
  );
  return JSON.parse(bytesToText(plano));
}
async function cargarDatosClaros(){
  try{
    const response=await fetch(ORIGEN_DATOS);
    if(!response.ok) throw new Error("No se han podido cargar los datos");
    datosOperacion=await response.json();
    montarVisor();
    renderTodo();
  }catch(error){
    showDataWarning();
  }
}
async function cargarDatosCifrados(password){
  const llavero=await cargarLlavero();
  claveMaestra=await obtenerClaveMaestra(password,llavero);
  datosOperacion=await descifrarContenido(llavero,claveMaestra);
  montarVisor();
  renderTodo();
}
function configurarAcceso(){
  const form=document.getElementById("accessForm");
  const input=document.getElementById("accessPassword");
  const button=document.getElementById("accessSubmit");
  const error=document.getElementById("accessError");
  input.focus();
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const password=input.value;
    if(!password) return;
    error.textContent="";
    button.disabled=true;
    input.disabled=true;
    button.textContent="Comprobando...";
    try{
      await cargarDatosCifrados(password);
    }catch(err){
      claveMaestra=null;
      error.textContent="Contraseña incorrecta";
      input.disabled=false;
      button.disabled=false;
      button.textContent="Entrar";
      input.value="";
      input.focus();
    }
  });
}
if(MODO_CLARO){
  // Modo de previsualización local: mantiene el origen JSON en claro solo con ?claro=1 mientras se validan cambios sin llavero cifrado.
  cargarDatosClaros();
}else{
  configurarAcceso();
}
</script>
