.mini p{margin:6px 0 0;color:rgba(253,251,247,.76);font-size:12px;font-weight:650;line-height:1.35}
.next-report{margin-top:10px;min-height:0}

.section{margin-bottom:clamp(30px,5vw,56px)}

.forecast-card{padding:20px;background:linear-gradient(180deg,#fff,#fffdfa);overflow:hidden}

  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));

}
.micro-cell{

}
.micro-value{
  display:block;

  font-weight:700;

}

}
.micro-cell.positive .micro-value{color:var(--ok)}
.micro-cell.pending .micro-value{color:var(--muted);font-size:15px}
.micro-grid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}
.micro-grid.dark .micro-cell{background:rgba(255,255,255,.06);border-color:rgba(253,251,247,.14)}
.micro-grid.dark .micro-label{color:#ffe0aa}

.forecast-grid{

}
.forecast-note{margin-top:12px}
.plan-card{padding:18px;overflow:hidden;background:linear-gradient(180deg,#fff,#fffdfa)}

.plan-expand{position:absolute;right:24px;bottom:24px;display:inline-flex;align-items:center;border-radius:999px;padding:8px 11px;background:rgba(253,251,247,.94);border:1px solid rgba(22,61,96,.15);color:var(--navy);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 10px 22px rgba(22,61,96,.12);pointer-events:none}
.plan-tabs{display:flex;gap:10px;max-width:100%;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}

.plan-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff;font:inherit;scroll-snap-align:start;cursor:pointer}
.plan-tab-thumb{width:72px;height:54px;object-fit:cover;border-radius:8px;opacity:.72}

.legal{margin:26px 0 8px;padding:22px 20px;border-top:1px solid var(--line);border-radius:14px;background:rgba(22,61,96,.035);color:var(--muted);font-size:12px;line-height:1.6;text-align:center}

.cdu-tdc-8f3a91{--cdu-src:'CdU de 0 a Exito'}

.legend{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;color:var(--muted);font-size:12px;font-weight:500;line-height:1.45}

.milestones{display:grid;gap:14px;min-width:0}
.milestone-phase{border:1px solid rgba(22,61,96,.13);border-radius:8px;background:linear-gradient(180deg,#fff,#fffdfa);box-shadow:0 16px 36px rgba(22,61,96,.08);overflow:hidden}

.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}

.statement-frame{width:100%;height:820px;border:1px solid rgba(22,61,96,.16);border-radius:8px;background:#f6f4ef}

.statement-mobile p{margin:0 0 12px;color:var(--navy);font-size:13px;font-weight:800}

.table-wrap{overflow-x:auto;padding:14px}
table{width:100%;min-width:820px;border-collapse:collapse}

.panel{padding:20px}

.camera-frame{

.photo-button img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f6f4ef}
.photo-meta{padding:13px 14px 15px}
.photo-date{display:block;color:var(--ochre);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
.photo-caption{margin:5px 0 0;color:var(--navy);font-size:13px;font-weight:800;line-height:1.35}
.photos-empty{margin:16px 0 0;padding:16px;border:1px dashed rgba(22,61,96,.22);border-radius:8px;background:#fffdf8;color:var(--muted);font-size:13px;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;background:rgba(15,44,71,.82)}
.lightbox[hidden]{display:none}
.lightbox img{display:block;max-width:min(100%,1100px);max-height:82vh;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.34)}
.folder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.folder{

}
.folder:hover{border-color:rgba(226,159,52,.75);box-shadow:0 8px 22px rgba(22,61,96,.08)}
.folder svg{flex:0 0 28px;width:28px;height:28px;fill:var(--ochre)}
.feed{display:grid;gap:12px}
.entry{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:16px}
.entry-date{color:var(--ochre);font-size:11px;font-weight:900;text-transform:uppercase}
.entry.market .entry-date{color:var(--navy)}
.entry b{display:block;color:var(--navy);font-size:15px}
.entry p{margin:4px 0 0;color:var(--muted);font-size:13px}
.entry-source{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin-top:4px;padding:8px 0;color:var(--ochre);font-size:13px;font-weight:600;text-decoration:none}
.entry-source:hover{text-decoration:underline}
.entry-source:active{color:#c9841e;opacity:.82}
#bitacoraFeed{position:relative;gap:14px;padding-left:20px}
#bitacoraFeed::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.bitacora-entry{position:relative;border-left:1px solid var(--line)}
.bitacora-entry::before{content:"";position:absolute;left:-18px;top:20px;width:7px;height:7px;border-radius:50%;background:rgba(22,61,96,.28);box-shadow:0 0 0 4px var(--cream)}
.bitacora-entry.latest{border-left:4px solid var(--ochre);background:#fffaf0}
.bitacora-entry.latest::before{left:-20px;top:24px;width:10px;height:10px;background:var(--ochre);box-shadow:0 0 0 5px rgba(226,159,52,.18)}
.entry-latest-label{display:inline-flex;width:max-content;max-width:100%;margin-bottom:8px;padding:5px 9px;border-radius:999px;background:var(--navy);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.4px;line-height:1;text-transform:uppercase}
.report{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px;color:var(--white);background:linear-gradient(135deg,var(--navy2),var(--navy))}
.report span{display:block;color:#ffe0aa;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.report b{display:block;margin-top:4px;font-size:clamp(20px,3vw,30px)}
.report p{margin:8px 0 0;color:rgba(253,251,247,.78);font-size:14px}
.data-warning{position:fixed;right:18px;bottom:18px;z-index:20;max-width:330px;padding:14px 16px;border:1px solid rgba(226,159,52,.45);border-radius:8px;background:var(--white);color:var(--navy);box-shadow:0 18px 45px rgba(15,44,71,.22);font-size:13px;font-weight:800}
.data-warning[hidden]{display:none}
.access-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px 18px;
  color:var(--cream);
  background:var(--navy);
}
.access-panel{
  width:min(100%,420px);
  display:grid;
  gap:18px;
  justify-items:center;
  text-align:center;
}
.access-logo{
  width:min(178px,52vw);
  height:auto;
  display:block;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.2));
}
.access-title{
  margin:8px 0 0;
  color:var(--cream);

}

  color:rgba(253,251,247,.78);
  font-size:14px;
  font-weight:600;
}
.access-form{
  width:100%;
  display:grid;
  gap:12px;
  margin-top:8px;
}
.access-field{
  display:grid;
  gap:7px;
  text-align:left;
}
.access-field label{
  color:#ffe0aa;
  font-size:12px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.access-field input{
  width:100%;
  min-height:48px;
  border:1px solid rgba(253,251,247,.25);
  border-radius:8px;
  padding:12px 13px;
  background:rgba(255,255,255,.08);
  color:var(--cream);

}

}

  font-size:13px;

  .plan-gallery{grid-template-columns:220px minmax(0,1fr);align-items:start}
  .plan-tabs{grid-column:1;grid-row:1;padding:2px 2px 2px 0;flex-direction:column;align-items:flex-start;overflow-x:auto;overflow-y:visible}

<body>
<!-- cdu-tdc-8f3a91 · Visor del Inversor · CdU de 0 a Exito · marcado de autoria, no eliminar -->

<section class="access-screen" id="accessScreen" aria-labelledby="accessTitle">
  <div class="access-panel">
    <img class="access-logo" src="logo-cdu-blanco.png" alt="CdU">
    <h1 class="access-title" id="accessTitle">Visor del Inversor</h1>
    <!-- Sin nombre de operacion: esta pantalla se ve SIN contrasena, y el nombre delataria
         de que operacion se trata a cualquiera que reciba el enlace. Mantener generico. -->
    <p class="access-context">Acceso privado para partícipes de la operación.</p>
    <form class="access-form" id="accessForm" autocomplete="off">
      <div class="access-field">
        <label for="accessPassword">Contraseña</label>
        <input id="accessPassword" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="access-submit" id="accessSubmit" type="submit">Entrar</button>
      <p class="access-error" id="accessError" role="alert" aria-live="assertive"></p>
    </form>
  </div>
</section>
<template id="visorTemplate">
<div class="shell">
  <header class="hero">
    <div class="topbar">
      <div class="private">Acceso privado</div>
    </div>
    <div class="hero-grid">
      <div class="hero-copy">
        <div class="identity-block">
          <div class="brand">
            <img class="brand-logo" src="logo-cdu-blanco.png" alt="CdU">
          </div>
          <div class="official-badge">Visor del Inversor · Herramienta oficial</div>
          <p class="operation-title">El cuadro de mandos de tu inversión</p>
        </div>
        <div class="operation-block">
          <h1 id="operationName">Operación: pendiente de confirmar</h1>
          <p class="headline-line" id="operationSummary">pendiente de confirmar</p>
          <p class="operation-location" id="operationLocation">pendiente de confirmar</p>
          <p class="subhead">Primero claridad. Luego control. Y al final, resultado. Una operación medida, documentada y visible de principio a fin.</p>
        </div>
      </div>
      <section class="pulse-card" aria-label="Estado y avance">
        <div class="state-line">
          <div class="state">Estado de operación</div>
          <span class="chip warn" id="operationState">pendiente de confirmar</span>
        </div>
        <div class="phase-line" id="phaseLine"></div>
        <div class="progress-line">
          <div class="bar" id="progressBar" aria-label="0% de avance global de operación"><span></span></div>
          <div class="pct" id="progressPct">0%</div>
        </div>
        <!-- Aclara QUE mide el porcentaje: sin esto, ver un 31% con la obra sin empezar
             se lee como avance de obra y parece inflado. -->
        <p class="progress-scope">Mide la operación de principio a fin: captación de la oportunidad, viabilidad, presentación a inversores, formalización y compra, transformación, venta de las unidades, reparto y cierre.</p>
        <div class="pulse-meta" id="pulseMeta"></div>
        <div class="mini next-report" id="nextReport"></div>
      </section>
    </div>
  </header>

  <main class="page">
    <section class="section" id="escenarioEconomicoSection" hidden>
      <div class="section-head">
        <div>
          <div class="kicker">Escenario económico</div>
          <h2>Números clave de la operación</h2>
          <p class="note">Escenario estimado de previsión; no es un resultado cerrado.</p>
        </div>
      </div>
      <div class="card forecast-card">
        <div class="forecast-grid micro-grid" id="forecastGrid"></div>
      </div>
    </section>

    <section class="section" id="transformacion">
      <div class="section-head">
        <div>
          <div class="kicker">Transformación</div>
          <h2 id="planTitle">Encaje de la operación</h2>
          <p class="note" id="planNote">pendiente de confirmar</p>
        </div>
        <span class="badge navy">Plano real del encaje</span>
      </div>
      <div class="card plan-card">
        <div class="plan-wrap">
          <div class="legend" id="planLegend"></div>
          <div class="plan-gallery" id="planGallery">
            <div class="plan-tabs" id="planTabs" role="tablist" aria-label="Planos y renders de la operación"></div>
            <div class="plan-frame">
              <button class="plan-action" type="button" id="activePlanButton" aria-label="Ampliar plano activo">
                <img class="plan-img" id="activePlanImage" src="" alt="">
              </button>
              <span class="plan-counter" id="planCounter">0 / 0</span>
              <span class="plan-expand">Ampliar</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="hitos">
      <div class="section-head">
        <div>
          <div class="kicker">Hitos de operación</div>
          <h2 id="milestoneTitle">pendiente de confirmar</h2>
          <p class="note">Los hitos cubren toda la operación. Lo conseguido brilla, el hito actual marca dónde estamos y lo pendiente queda preparado para lo que viene.</p>
        </div>
        <span class="badge navy" id="milestoneCounter">pendiente de confirmar</span>
      </div>
      <div class="milestones" id="milestones"></div>
      <div class="action-row">
        <p class="note">Celebración sobria: sello, evidencia y actualización del punto de avance.</p>
      </div>
    </section>

    <section class="section" id="cronograma">
      <div class="section-head">
        <div>
          <div class="kicker">Cronograma</div>
          <h2 id="ganttTitle">pendiente de confirmar</h2>
          <p class="note" id="ganttNoteIntro">pendiente de confirmar</p>
        </div>
      </div>
      <div class="card gantt-card">
        <div class="gantt-note" id="ganttNote">pendiente de confirmar</div>
        <div class="gantt-inner">
          <div class="week-current" id="weekCurrent" aria-hidden="true"><span id="ganttCurrentWeek">pendiente de confirmar</span></div>
          <div class="gantt-grid" id="gantt"></div>
        </div>
        <p class="gantt-foot" id="ganttFoot">pendiente de confirmar</p>
      </div>
    </section>

    <section class="section" id="cuentas">
      <div class="section-head">
        <div>
          <div class="kicker">Económico</div>
          <h2>Extracto de la cuenta de la operación</h2>
          <p class="note">Cuenta bancaria dedicada para que las aportaciones y pagos de la operación queden separados del resto de operaciones.</p>
        </div>
      </div>
      <div class="card bank-card">
        <div class="bank-top">

<script>
// El JSON en claro NO se publica nunca (se retiro del sitio el 14-ago: exponia los datos
// de la operacion sin cifrar). Por eso la previsualizacion local lo lee por ruta relativa
// desde el propio repositorio, y el sitio publicado solo sirve el llavero cifrado.
const ORIGEN_DATOS = '../../data/tdc/operacion.json';
const ORIGEN_LLAVERO = 'https://xaviriera.github.io/operaciones-gestor/data/tdc/llavero.json';

let datosOperacion=null;
let claveMaestra=null;
let llaveroCifrado=null;
let visorMontado=false;
let extractoPdfUrl=null;
// El modo de previsualizacion en claro SOLO se permite en local (localhost/127.0.0.1).
// En el sitio publicado queda desactivado: si no, ?claro=1 saltaria la contrasena y el cifrado no serviria de nada.
const ES_ENTORNO_LOCAL=["localhost","127.0.0.1","::1",""].includes(window.location.hostname);
const MODO_CLARO=ES_ENTORNO_LOCAL && new URLSearchParams(window.location.search).get("claro")==="1";
const PENDIENTE="pendiente de confirmar";
const CAMARA_SIN_SENAL="disponible al iniciar la obra";
const ESTADOS={conseguido:"done",actual:"current",pendiente:"pending"};

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}
function escapeAttr(value){
  return escapeHtml(value).replace(/`/g,"&#96;");
}
function valor(value){
  return value===null || value===undefined || value==="" ? PENDIENTE : value;
}
function esPantallaPequena(){
  return window.matchMedia("(max-width: 700px)").matches;
}
function liberarExtractoPdfUrl(){
  if(extractoPdfUrl){
    URL.revokeObjectURL(extractoPdfUrl);
    extractoPdfUrl=null;
  }
}
function crearPdfUrlDesdeBase64(base64){
  const limpio=String(base64 || "").replace(/\s/g,"");
  if(!limpio) return "";
  const binario=atob(limpio);
  const bytes=new Uint8Array(binario.length);
  for(let i=0;i<binario.length;i+=1){
    bytes[i]=binario.charCodeAt(i);
  }
  const blob=new Blob([bytes],{type:"application/pdf"});
  extractoPdfUrl=URL.createObjectURL(blob);
  return extractoPdfUrl;
}
function folderIcon(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5v-10Z"/></svg>';
}
function estadoClase(estado){
  return ESTADOS[estado] || "pending";
}
function estadoEtiqueta(estado){
  if(estado==="conseguido") return "Conseguido";
  if(estado==="actual") return "En proceso";
  return "Pendiente";
}
function calcularPorcentajeAvance(estado){
  const avanceManual=Number(estado.porcentaje_avance);
  if(estado.porcentaje_avance !== null && estado.porcentaje_avance !== undefined && estado.porcentaje_avance !== "" && Number.isFinite(avanceManual)){
    return avanceManual;
  }
  const hitos=Array.isArray(datosOperacion.hitos) ? datosOperacion.hitos : [];
  const pesoTotal=hitos.reduce((total,hito)=>{
    const peso=Number(hito.peso);
    return Number.isFinite(peso) ? total+peso : total;
  },0);
  if(pesoTotal<=0) return null;
  // El avance se calcula desde los pesos de los hitos: conseguido suma todo su peso,
  // actual suma la mitad y pendiente no suma; solo se escribe a mano para forzar un valor.
  const avance=hitos.reduce((total,hito)=>{
    const peso=Number(hito.peso);
    if(!Number.isFinite(peso)) return total;
    if(hito.estado==="conseguido") return total+peso;
    if(hito.estado==="actual") return total+(peso/2);
    return total;
  },0);
  return Math.round(avance);
}
function renderOperacion(){
  const operacion=datosOperacion.operacion || {};
  document.title=`Visor del Inversor · ${valor(operacion.nombre)}`;
  document.getElementById("operationName").textContent=`Operación: ${valor(operacion.nombre)}`;
  document.getElementById("operationSummary").textContent=valor(operacion.resumen_una_linea);
  document.getElementById("operationLocation").textContent=valor(operacion.direccion);
  document.getElementById("planNote").textContent=valor(operacion.resumen_una_linea);
  document.getElementById("planLegend").innerHTML=[
    ["Dirección", operacion.direccion],
    ["Ref. cat.", operacion.referencia_catastral],
    ["Finca", operacion.finca_registral]
  ].map(([label,value])=>`<div class="legend-item"><b>${escapeHtml(label)}</b><span>${escapeHtml(valor(value))}</span></div>`).join("");
}
function renderPlanos(){
  const planosVistos=new Set();
  const planos=Array.isArray(datosOperacion.planos) ? datosOperacion.planos.filter(plano=>{
    if(!plano || !plano.fichero) return false;
    if(planosVistos.has(plano.fichero)) return false;
    planosVistos.add(plano.fichero);
    return true;
  }) : [];
  const image=document.getElementById("activePlanImage");
  const button=document.getElementById("activePlanButton");
  const counter=document.getElementById("planCounter");
  const tabs=document.getElementById("planTabs");
  if(!planos.length){
    image.removeAttribute("src");
    image.alt=PENDIENTE;
    button.disabled=true;
    button.removeAttribute("data-plan-url");
    button.removeAttribute("data-plan-name");
    counter.textContent="0 / 0";
    tabs.innerHTML=`<div class="plan-empty">${escapeHtml(PENDIENTE)}</div>`;
    return;
  }
  button.disabled=false;
  tabs.innerHTML=planos.map((plano,index)=>`
    <button class="plan-tab" type="button" role="tab" aria-selected="${index===0 ? "true" : "false"}" data-plan-index="${escapeAttr(index)}">
      <img class="plan-tab-thumb" src="${escapeAttr(plano.fichero || "")}" alt="">
      <span class="plan-tab-label">${escapeHtml((valor(plano.nombre).match(/Vivienda\s+\d+/i) || [valor(plano.nombre).toLowerCase().includes("encaje") ? "Encaje" : valor(plano.nombre).split(/\s+/).slice(0,2).join(" ")])[0])}</span>
    </button>
  `).join("");
  const activarPlano=index=>{
    const plano=planos[index] || planos[0];
    const nombre=valor(plano.nombre);
    const fichero=plano.fichero || "";
    image.src=fichero;
    image.alt=nombre;
    button.dataset.planUrl=fichero;
    button.dataset.planName=nombre;
    counter.textContent=`${index+1} / ${planos.length}`;
    tabs.querySelectorAll(".plan-tab").forEach(tab=>{
      const activo=Number(tab.dataset.planIndex)===index;
      tab.classList.toggle("active",activo);
      tab.setAttribute("aria-selected",activo ? "true" : "false");
    });
  };
  tabs.querySelectorAll(".plan-tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      activarPlano(Number(tab.dataset.planIndex));
    });
  });
  button.onclick=()=>{
    abrirFotoAvance(button.dataset.planUrl,button.dataset.planName);
  };
  activarPlano(0);
}
function renderEstado(){
  const estado=datosOperacion.estado || {};
  document.getElementById("operationState").textContent=valor(estado.fase_actual);
  document.getElementById("phaseLine").innerHTML=(estado.fases || []).map(fase=>{
    const clase=estadoClase(fase.estado);
    const icono=clase==="done" ? '<span class="check">✓</span>' : '<span class="dot"></span>';
    // La descripcion importa: "GO", "MAP" y "EXITO" no dicen nada a un participe.
    // Con ella se entiende que la operacion empezo mucho antes de la obra.
    const desc = fase.descripcion ? `<span class="phase-desc">${escapeHtml(fase.descripcion)}</span>` : "";
    return `<div class="phase ${escapeAttr(clase)}"><small>${icono} ${escapeHtml(estadoEtiqueta(fase.estado))}</small><b>${escapeHtml(valor(fase.nombre))}</b>${desc}</div>`;
  }).join("");
  // Sin dato de avance NO se pinta un 0%: un cero se lee como "no ha avanzado nada",
  // que es peor que reconocer que el dato aun no esta confirmado.
  const avance = calcularPorcentajeAvance(estado);
  const hayAvance = avance !== null;
  const progressBar=document.getElementById("progressBar");
  progressBar.setAttribute("aria-label", hayAvance ? `${avance}% de avance global de operación` : "Avance global pendiente de confirmar");
  progressBar.querySelector("span").style.setProperty("--progress", hayAvance ? `${avance}%` : "0%");
  const pct=document.getElementById("progressPct");
  pct.textContent = hayAvance ? `${avance}%` : PENDIENTE;
  pct.style.fontSize = hayAvance ? "" : "15px";
  document.getElementById("pulseMeta").innerHTML=`
    <div class="micro-grid compact dark">
      <div class="micro-cell"><span class="micro-label">Fase actual</span><b class="micro-value">${escapeHtml(valor(estado.fase_actual))}</b></div>
      <div class="micro-cell"><span class="micro-label">Avance</span><b class="micro-value">${hayAvance ? `${avance}%` : PENDIENTE}</b></div>
    </div>`;
}
function renderProximoReporte(){
  const reporte=datosOperacion.proximo_reporte || {};
  document.getElementById("nextReport").innerHTML=`
    <span>Próxima reunión de avances</span>
    <b>${escapeHtml(valor(reporte.fecha))}</b>
    <p>${escapeHtml(valor(reporte.texto))}</p>`;
}
function renderEscenarioEconomico(){
  const section=document.getElementById("escenarioEconomicoSection");
  const grid=document.getElementById("forecastGrid");
  if(!Object.prototype.hasOwnProperty.call(datosOperacion,"escenario_economico")){
    section.hidden=true;
    grid.innerHTML="";
    return;
  }
  const escenario=datosOperacion.escenario_economico || {};
  const items=[
    ["Rentabilidad sobre el capital", escenario.rentabilidad_capital, "hero positive"],
    ["Inversión total", escenario.inversion_total, ""],
    ["Capital de los inversores", escenario.capital_inversores, ""],
    ["Capital del equipo gestor", escenario.capital_equipo_gestor, ""],
    ["Venta prevista realista", escenario.venta_prevista_realista, ""],
    ["Venta prevista optimista", escenario.venta_prevista_optimista, ""],
    ["Beneficio previsto", escenario.beneficio_realista, "positive"]
  ];
  section.hidden=false;
  grid.innerHTML=items.map(([label,value,classes])=>{
    const pendiente=value===null || value===undefined || value==="";
    const microClasses=classes.replace(/\bhero\b/g,"").trim();
    return `
      <article class="micro-cell ${escapeAttr(microClasses)}${pendiente ? " pending" : ""}">
        <span class="micro-label">${escapeHtml(label)}</span>
        <b class="micro-value">${escapeHtml(valor(value))}</b>
      </article>`;
  }).join("");
}
function renderHitos(){
  const items=datosOperacion.hitos || [];
  const fases=(datosOperacion.estado && datosOperacion.estado.fases) || [];
  const conseguidos=items.filter(item=>item.estado==="conseguido").length;
  const total=items.length;
  const proximoIndex=items.findIndex(item=>item.estado==="pendiente");
  document.getElementById("milestoneCounter").textContent=total ? `${conseguidos} de ${total} hitos` : PENDIENTE;
  document.getElementById("milestoneTitle").textContent=total ? `${conseguidos} de ${total} hitos conseguidos` : PENDIENTE;
  const renderCard=(hito,index)=>{
    const clase=estadoClase(hito.estado);
    const proximo=index===proximoIndex ? '<span class="badge next">Próximo</span>' : "";
    return `
      <article class="milestone ${escapeAttr(clase)}" data-index="${index}">
        <div>
          <div class="toprow"><span class="num">${clase==="done" ? "✓" : index+1}</span>${proximo || (clase==="current" ? '<span class="spark" aria-hidden="true"></span>' : "")}</div>
          <b>${escapeHtml(valor(hito.nombre))}</b>
          <span class="date">${escapeHtml(valor(hito.fecha))}</span>
          <p class="meaning">${escapeHtml(valor(hito.detalle))}</p>
        </div>
        <div><span class="stamp ${escapeAttr(clase)}">${clase==="done" ? "✓ Conseguido" : estadoEtiqueta(hito.estado)}</span></div>
      </article>`;
  };
  // Los grupos se derivan de los propios datos, en su orden de aparición.
  // NUNCA volver a fijarlos a mano: si un grupo del JSON no estaba en la lista,
  // sus hitos desaparecian del visor sin avisar (paso el 16-ago-2026: 10 hitos invisibles).
  const gruposExito=[...new Set(
    items.filter(h=>h.fase==="Fase 3 · ÉXITO" && h.grupo).map(h=>h.grupo)
  )];
  document.getElementById("milestones").innerHTML=fases.map(fase=>{
    const hitosFase=items
      .map((hito,index)=>({hito,index}))
      .filter(item=>item.hito.fase===fase.nombre);
    const hechosFase=hitosFase.filter(item=>item.hito.estado==="conseguido").length;
    const claseFase=estadoClase(fase.estado);
    const cuerpo=fase.nombre==="Fase 3 · ÉXITO" ? gruposExito.map(grupo=>{
      const hitosGrupo=hitosFase.filter(item=>item.hito.grupo===grupo);
      if(!hitosGrupo.length) return "";
      return `
        <div class="milestone-group">
          <div class="milestone-group-label">${escapeHtml(grupo)}</div>
          <div class="milestone-grid">
            ${hitosGrupo.map(item=>renderCard(item.hito,item.index)).join("")}
          </div>
        </div>`;
    }).join("") + (()=>{
      // Red de seguridad: ningun hito puede quedar sin pintar por no tener grupo.
      const sueltos=hitosFase.filter(item=>!item.hito.grupo);
      return sueltos.length ? `<div class="milestone-grid">${sueltos.map(item=>renderCard(item.hito,item.index)).join("")}</div>` : "";
    })() : `
      <div class="milestone-grid">
        ${hitosFase.map(item=>renderCard(item.hito,item.index)).join("")}
      </div>`;
    return `
      <section class="milestone-phase phase-${escapeAttr(claseFase)}">
        <div class="milestone-phase-head">
          <div class="milestone-phase-title">
            <small>${escapeHtml(estadoEtiqueta(fase.estado))}</small>
            <h3>${escapeHtml(valor(fase.nombre))}</h3>
          </div>
          <div class="milestone-phase-meta">
            <span class="stamp ${escapeAttr(claseFase)}">${claseFase==="done" ? "✓ Cerrada" : estadoEtiqueta(fase.estado)}</span>
            <span class="badge navy">${hechosFase} de ${hitosFase.length} hitos</span>
          </div>
        </div>
        <div class="milestone-phase-body">${cuerpo}</div>
      </section>`;
  }).join("");
}
function renderGantt(){
  const cronograma=datosOperacion.cronograma || {};
  const capitulos=cronograma.capitulos || [];
  const total=Math.max(Number(cronograma.total_semanas) || 16, 1);
  const semanaActual=Number(cronograma.semana_actual) || 0;
  document.getElementById("ganttTitle").textContent=`Cronograma de obra · ${total} semanas`;
  const inicioTxt=cronograma.fecha_inicio ? ` · Inicio de obra: ${cronograma.fecha_inicio}` : "";
  document.getElementById("ganttNoteIntro").textContent=`Semana actual: ${semanaActual || PENDIENTE}${inicioTxt}`;
  document.getElementById("ganttNote").textContent=(cronograma.notas_transversales || []).join(" · ") || PENDIENTE;
  document.getElementById("ganttCurrentWeek").textContent=semanaActual ? `Semana ${semanaActual}` : PENDIENTE;
  document.getElementById("ganttFoot").textContent=`Cronograma de obra · ${total} semanas`;
  document.getElementById("gantt").style.gridTemplateColumns=`64px 270px repeat(${total},minmax(36px,1fr))`;
  document.getElementById("weekCurrent").style.left=`calc(334px + ((100% - 334px) / ${total}) * ${Math.max(semanaActual - .5, 0)})`;
  const head=`<div class="week-head"><b>Cap</b><b>Tarea</b>${Array.from({length:total},(_,i)=>`<span>S${i+1}</span>`).join("")}</div>`;
  const rows=capitulos.map((fila,index)=>`
    <div class="gantt-row">
      <div class="gantt-cap">${index+1}</div>
      <div class="gantt-task">${escapeHtml(valor(fila.nombre))}</div>
      ${Array.from({length:total},(_,i)=>{
        const week=i+1;
        const inicio=Number(fila.semana_inicio) || 0;
        const fin=Number(fila.semana_fin) || 0;
        const inRange=week>=inicio&&week<=fin;
        const tipo=fila.color_o_tipo || "#163D60";
        const marker=tipo==="hito" ? `<div class="gantt-milestone-label">✓ Hito</div>` : `<div class="bar-seg" style="--bar:${escapeAttr(tipo)}"></div>`;
        return `<div class="gcell">${inRange?marker:""}</div>`;
      }).join("")}
    </div>
  `).join("");
  document.getElementById("gantt").innerHTML=head+rows;
}
function renderEconomico(){
  const cuentas=datosOperacion.cuentas || {};
  document.getElementById("iban").innerHTML=`${escapeHtml(valor(cuentas.iban))} <small>Cuenta dedicada de la operación</small>`;
  const saldo=valor(cuentas.saldo);
  const fechaSaldo=cuentas.saldo_fecha ? ` · a ${escapeHtml(cuentas.saldo_fecha)}` : "";
  document.getElementById("accountBalance").innerHTML=`Saldo en cuenta <span>· ${escapeHtml(saldo)}</span>${fechaSaldo}`;
  document.getElementById("trancheGrid").innerHTML=(cuentas.tramos || []).map(item=>{
    const ok=Boolean(item.confirmado);
    const tieneNota=Boolean(item.nota);
    const nota=tieneNota ? `<details class="tranche-detail"><summary>Ver detalle</summary><p>${escapeHtml(item.nota)}</p></details>` : "";
    const importe=item.importe ? `<strong class="tranche-amount">${escapeHtml(item.importe)}</strong>` : "";
    return `
    <div class="tranche ${ok?"done":"pending"}"><div class="tranche-line"><span class="tranche-name">${escapeHtml(valor(item.nombre))}</span><span class="tranche-pill ${ok?"done":"pending"}">${ok?"Confirmado":"Pendiente"}</span>${importe}</div>${nota}</div>`;
  }).join("");
  document.getElementById("financeSummary").innerHTML=[
    ["Tramos", (cuentas.tramos || []).length || null, "Número de tramos configurados"],
    ["Pendientes", (cuentas.tramos || []).filter(item=>!item.confirmado).length || null, "Importes por confirmar"]
  ].map(([label,value,detail])=>`
    <div class="micro-cell"><span class="micro-label">${escapeHtml(label)}</span><b class="micro-value">${escapeHtml(valor(value))}</b><small class="micro-detail">${escapeHtml(detail)}</small></div>
  `).join("");
  renderExtractoBancario(cuentas);
}
function renderExtractoBancario(cuentas){
  const contenedor=document.getElementById("bankStatement");
  liberarExtractoPdfUrl();
  if(!cuentas.extracto_pdf_base64){
    contenedor.hidden=true;
    contenedor.innerHTML="";
    return;
  }
  const periodo=valor(cuentas.extracto_periodo);
  let pdfUrl="";
  try{
    pdfUrl=crearPdfUrlDesdeBase64(cuentas.extracto_pdf_base64);
  }catch(error){
    contenedor.hidden=false;
    contenedor.classList.add("statement-fallback");
    contenedor.innerHTML=`
      <div class="bank-statement-head">
        <div class="bank-statement-title"><span>Extracto bancario</span><b>Documento oficial · ${escapeHtml(periodo)}</b></div>
      </div>
      <div class="statement-mobile"><p>El extracto del banco no se ha podido preparar en este navegador.</p></div>`;
    return;
  }
  const fallback=esPantallaPequena();
  contenedor.hidden=false;
  contenedor.classList.toggle("statement-fallback",fallback);
  contenedor.innerHTML=`
    <div class="bank-statement-head">
      <div class="bank-statement-title"><span>Extracto bancario</span><b>Documento oficial · ${escapeHtml(periodo)}</b></div>
      <a class="statement-open" href="${escapeAttr(pdfUrl)}" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
    </div>
    ${fallback ? "" : `<iframe class="statement-frame" src="${escapeAttr(pdfUrl)}#navpanes=0&toolbar=1" title="Extracto bancario Santander ${escapeAttr(periodo)}"></iframe>`}
    <div class="statement-mobile">
      <p>En móvil el visor integrado puede no estar disponible.</p>
      <a class="statement-open" href="${escapeAttr(pdfUrl)}" target="_blank" rel="noopener">Abrir el extracto del banco</a>
    </div>`;
  const frame=contenedor.querySelector(".statement-frame");
  if(frame){
    frame.addEventListener("error",()=>{
      contenedor.classList.add("statement-fallback");
    });
  }
}

function base64ToBytes(value){
  const binary=atob(value);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i+=1) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function bytesToText(bytes){
  return new TextDecoder().decode(bytes);
}
function esEspacioPython(ch){
  const cp=ch.codePointAt(0);
  return (cp>=0x09 && cp<=0x0D) || (cp>=0x1C && cp<=0x20) || cp===0x85 || cp===0xA0 || cp===0x1680 || (cp>=0x2000 && cp<=0x200A) || (cp>=0x2028 && cp<=0x2029) || cp===0x202F || cp===0x205F || cp===0x3000;
}
function normalizarPassword(password){
  // ======================================================================
  // NORMALIZACION CRITICA Y COMPARTIDA:
  // Esta funcion debe mantenerse IDENTICA a tools/cifrar-visor.py. Si se
  // cambia aqui, hay que cambiarla tambien en gestion/index.html y en
  // tools/cifrar-visor.py, o se rompe el acceso al derivar PBKDF2.
  // ======================================================================
  return Array.from(password).filter(ch=>!esEspacioPython(ch) && ch!=="-" && ch!==".").join("").toUpperCase();
}
async function derivarClavePassword(password,salt,iteraciones){
  const material=await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(normalizarPassword(password)),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:iteraciones,hash:"SHA-256"},
    material,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
}
async function abrirSobre(password,sobre,iteraciones){
  const clavePassword=await derivarClavePassword(password,base64ToBytes(sobre.salt),iteraciones);
  const clavePlano=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:base64ToBytes(sobre.iv)},
    clavePassword,
    base64ToBytes(sobre.clave_cifrada)
  );
  return crypto.subtle.importKey("raw",clavePlano,{name:"AES-GCM"},false,["decrypt"]);
}
let aliasAcceso="";
async function obtenerClaveMaestra(password,llavero){
  for(const sobre of llavero.sobres || []){
    try{
      const clave=await abrirSobre(password,sobre,llavero.iteraciones);
      aliasAcceso=sobre.alias || "";
      pintarMarcaAgua(aliasAcceso);
      return clave;
    }catch(error){
      continue;
    }
  }
  throw new Error("Contraseña incorrecta");
}
// Marca de agua con el identificador del acceso: si circula una captura, se sabe de que
// acceso salio. Trazabilidad, no proteccion criptografica.
function pintarMarcaAgua(alias){
  if(!alias) return;
  const texto=`${alias} · CdU de 0 a Éxito · uso privado`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240"><text x="0" y="130" transform="rotate(-24 0 130)" font-family="Montserrat,Arial,sans-serif" font-size="15" font-weight="700" fill="%23163D60" fill-opacity="0.055">${texto}</text></svg>`;
  let capa=document.getElementById("marcaAgua");
  if(!capa){
    capa=document.createElement("div");
    capa.id="marcaAgua";
    document.body.appendChild(capa);
  }
  capa.style.backgroundImage=`url('data:image/svg+xml;utf8,${encodeURIComponent(svg).replace(/'/g,"%27")}')`;
}
async function cargarLlavero(){
  if(llaveroCifrado) return llaveroCifrado;
  const response=await fetch(ORIGEN_LLAVERO);
  if(!response.ok) throw new Error("No se ha podido cargar el llavero");
  llaveroCifrado=await response.json();
  return llaveroCifrado;
}
async function descifrarContenido(llavero,masterKey){
  const contenido=llavero.contenido || {};
  const plano=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:base64ToBytes(contenido.iv)},
    masterKey,
    base64ToBytes(contenido.datos)
  );
  return JSON.parse(bytesToText(plano));
}
async function cargarDatosClaros(){
  try{
    const response=await fetch(ORIGEN_DATOS);
    if(!response.ok) throw new Error("No se han podido cargar los datos");
    datosOperacion=await response.json();
    montarVisor();
    renderTodo();
  }catch(error){
    showDataWarning();
  }
}
async function cargarDatosCifrados(password){
  const llavero=await cargarLlavero();
  claveMaestra=await obtenerClaveMaestra(password,llavero);
  datosOperacion=await descifrarContenido(llavero,claveMaestra);
  montarVisor();
  renderTodo();
}
function configurarAcceso(){
  const form=document.getElementById("accessForm");
  const input=document.getElementById("accessPassword");
  const button=document.getElementById("accessSubmit");
  const error=document.getElementById("accessError");
  input.focus();
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const password=input.value;
    if(!password) return;
    error.textContent="";
    button.disabled=true;
    input.disabled=true;
    button.textContent="Comprobando...";
    try{
      await cargarDatosCifrados(password);
    }catch(err){
      claveMaestra=null;
      error.textContent="Contraseña incorrecta";
      input.disabled=false;
      button.disabled=false;
      button.textContent="Entrar";
      input.value="";
      input.focus();
    }
  });
}
if(MODO_CLARO){
  // Modo de previsualización local: mantiene el origen JSON en claro solo con ?claro=1 mientras se validan cambios sin llavero cifrado.
  cargarDatosClaros();
}else{
  configurarAcceso();
}
